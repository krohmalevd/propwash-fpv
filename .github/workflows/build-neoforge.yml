
name: Build Propwash FPV NeoForge RU

on:
  push:
    branches:
      - feat/russian-localization
    paths:
      - ".github/workflows/build-neoforge.yml"
      - "common/src/lang/**"
      - "common/src/main/resources/assets/propwash/lang/**"
      - "common/src/main/java/**"
      - "neoforge/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - "common/build.gradle"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge JAR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        run: |
          chmod +x gradlew
          ./gradlew :neoforge:build --configure-on-demand --console=plain -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=180000

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: propwash-neoforge-russian
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
